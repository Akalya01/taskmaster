deploy:
  needs: build
  runs-on: ubuntu-latest

  steps:
    - name: Deploy to server via SSH
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app-poc:latest
          docker stop frontend-poc || true
          docker rm frontend-poc || true
          docker run -d \
            --name frontend-poc \
            -p 4000:3000 \
            --restart unless-stopped \
            ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app-poc:latest
