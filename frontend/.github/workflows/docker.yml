  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Akamai server via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AKAMAI_HOST }}
          username: ${{ secrets.AKAMAI_USER }}
          key: ${{ secrets.AKAMAI_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app-poc:latest
            docker stop frontend-poc || true
            docker rm frontend-poc || true
            docker run -d \
              --name frontend-poc \
              -p 4000:4000 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/frontend-app-poc:latest
